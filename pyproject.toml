[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wudrivers"
dynamic = ["version"]
description = "Find and download the driver bundle a PC maker publishes on Windows Update, from Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Birk Skyum" }]
classifiers = ["Operating System :: POSIX :: Linux", "Environment :: Console", "Topic :: System :: Hardware"]

[project.urls]
Homepage = "https://github.com/birkskyum/wudrivers"

[project.scripts]
wudrivers = "wudrivers.cli:main"

[tool.setuptools.dynamic]
version = { attr = "wudrivers.__version__" }
